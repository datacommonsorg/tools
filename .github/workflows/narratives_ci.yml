name: Narratives CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Lint, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: narratives

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 10.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: 'narratives/.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'narratives/pnpm-lock.yaml'

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: 'narratives/agent/uv.lock'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ~1.6
          terraform_wrapper: false

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync --frozen --project agent

      - name: Run lint and style checks
        run: pnpm lint

      - name: Run UI unit tests
        run: pnpm test:ui

      - name: Run agent unit tests
        run: pnpm test:agent

      - name: Run production build
        run: pnpm build
