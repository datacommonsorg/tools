name: Data Weaver CI

on:
  push:
    branches: [main, master]
    paths:
      - 'dataweaver/**'
      - '.github/workflows/dataweaver_ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'dataweaver/**'
      - '.github/workflows/dataweaver_ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Lint, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dataweaver

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'dataweaver/.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'dataweaver/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint and style checks
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Run production build
        run: pnpm build
