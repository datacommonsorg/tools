name: Data Weaver CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Lint, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dataweaver

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 10.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: 'dataweaver/.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'dataweaver/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint and style checks
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Run production build
        run: pnpm build
