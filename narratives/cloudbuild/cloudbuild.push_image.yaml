# Official CI/CD pipeline for building and pushing the Narratives container
# image to GCR / Artifact Registry in datcom-ci and triggering the
# datacommons-website autopush deployment via Pub/Sub.
#
# Trigger: push to main branch on datacommonsorg/tools, filtered to paths
# matching narratives/**.

substitutions:
  _BASE_PATH: /narratives/

steps:
  # 1. Compile the React SPA with VITE_BASE_PATH=/narratives/ and stage
  #    ui/dist/ into agent/static/ and defaults/ into agent/defaults/.
  - id: build-ui-and-stage
    name: node:24
    dir: narratives
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        corepack enable
        pnpm install --frozen-lockfile
        VITE_BASE_PATH="${_BASE_PATH}" pnpm build

  # 2. Build and push the multi-stage container image to datcom-ci.
  - id: push-narratives-image
    name: gcr.io/cloud-builders/docker
    dir: narratives/agent
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        docker buildx build \
          --platform linux/amd64 \
          -t "gcr.io/$PROJECT_ID/datacommons-narratives:$SHORT_SHA" \
          -t "gcr.io/$PROJECT_ID/datacommons-narratives:latest" \
          -t "gcr.io/$PROJECT_ID/datacommons-narratives:cicd" \
          --push \
          .
    waitFor: ["build-ui-and-stage"]

  # 3. Publish a Pub/Sub message to notify datacommons-website Cloud Deploy
  #    that a new narratives image has been pushed.
  - id: publish-image-pushed
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - pubsub
      - topics
      - publish
      - narratives-image-pushed
      - --project=$PROJECT_ID
      - --message=$SHORT_SHA
    waitFor: ["push-narratives-image"]

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true
  machineType: E2_HIGHCPU_8

timeout: 1800s
