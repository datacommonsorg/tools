# Official CI/CD pipeline for building and pushing the Discover container
# image (alongside the legacy datacommons-narratives image during migration)
# to Artifact Registry in datcom-ci and notifying the datacommons-website
# Cloud Deploy pipeline via Pub/Sub.
#
# Trigger: push to main branch on datacommonsorg/tools, filtered to paths
# matching narratives/**.

steps:
  # 1. Build and push the multi-stage container image to datcom-ci under both
  #    datacommons-discover and legacy datacommons-narratives tags.
  # TODO(juliawu): Remove narratives image once we've migrated to the discover
  #                image in the downstream website pipeline.
  - id: push-discover-image
    name: gcr.io/cloud-builders/docker
    dir: narratives
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        docker build \
          -t "gcr.io/$PROJECT_ID/datacommons-discover:$SHORT_SHA" \
          -t "gcr.io/$PROJECT_ID/datacommons-discover:latest" \
          -t "gcr.io/$PROJECT_ID/datacommons-discover:cicd" \
          -t "gcr.io/$PROJECT_ID/datacommons-narratives:$SHORT_SHA" \
          -t "gcr.io/$PROJECT_ID/datacommons-narratives:latest" \
          -t "gcr.io/$PROJECT_ID/datacommons-narratives:cicd" \
          .
        docker push "gcr.io/$PROJECT_ID/datacommons-discover:$SHORT_SHA"
        docker push "gcr.io/$PROJECT_ID/datacommons-discover:latest"
        docker push "gcr.io/$PROJECT_ID/datacommons-discover:cicd"
        docker push "gcr.io/$PROJECT_ID/datacommons-narratives:$SHORT_SHA"
        docker push "gcr.io/$PROJECT_ID/datacommons-narratives:latest"
        docker push "gcr.io/$PROJECT_ID/datacommons-narratives:cicd"

  # 2. Publish Pub/Sub messages to both the Discover topic and the legacy
  #    Narratives topic so datacommons-website Cloud Deploy triggers cleanly
  #    before and after the trigger subscription cutover.
  # TODO(juliawu): Remove narratives Pub/Sub once downstream website pipeline
  #                is migrated over to the discover Pub/Sub message.
  - id: publish-discover-image-pushed
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - pubsub
      - topics
      - publish
      - discover-image-pushed
      - --project=$PROJECT_ID
      - --message=$SHORT_SHA
    waitFor: ["push-discover-image"]

  - id: publish-narratives-image-pushed
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - pubsub
      - topics
      - publish
      - narratives-image-pushed
      - --project=$PROJECT_ID
      - --message=$SHORT_SHA
    waitFor: ["push-discover-image"]

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true
  machineType: E2_HIGHCPU_8

timeout: 1800s
