<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom DC</title>
    <!-- Overridden from branding.json's `favicon` once brand.js has run. -->
    <link rel="icon" href="/dc-logo.svg" />
    <!--
      Per-instance brand variables, generated by the agent at startup from the
      branding.json it holds in memory. A stylesheet in <head> blocks first
      paint, so the instance's colours are in place for the very first frame
      rather than index.css's fallbacks being painted and then recoloured once
      React has fetched /agent/brand. Carries no values itself — they only ever
      come from the agent at runtime. If the request fails the browser ignores
      it and the index.css fallbacks stand.
    -->
    <link rel="stylesheet" href="/agent/brand.css" />
    <!--
      Per-instance branding document, published by the agent as
      `window.__BRAND__` out of the same startup-loaded memory brand.css is
      rendered from. A blocking classic script here runs before the bundle
      below, so useBranding() can seed its first render with this instance's
      headline, wordmark, logo, nav tabs and suggestion chips.

      brand.css alone only gets the *colours* onto the first frame; without this
      the text and layout still paint as the UI's shipped neutral defaults and
      then visibly flip once /agent/brand resolves. If this request fails the
      global is simply absent and useBranding() falls back to that fetch.

      Deliberately a classic script, not type="module". `vite build` warns that
      it "can't be bundled without type=module" — that warning is expected and
      wanted: adding the attribute would make Vite try to bundle a path that
      only exists at runtime, and would defer execution. Leave it as is.
    -->
    <script src="/agent/brand.js"></script>
    <!-- Data Commons web components (used by ChartTile to render charts). -->
    <script src="https://datacommons.org/datacommons.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
