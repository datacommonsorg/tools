<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- `#theme-tokens` holds optional `--theme-*` CSS custom property overrides,
         and `#instance-config` holds optional theme JSON read by `getInstanceConfig()`.
         `#runtime-config` holds the chat availability JSON that the server
         stamps when it serves this file, read by `getRuntimeConfig()`. -->
    <title id="theme-title">Data Commons</title>
    <link id="theme-favicon" rel="icon" type="image/svg+xml" href="/dc-logo.svg" />
    <style id="theme-tokens"></style>
    <script id="instance-config" type="application/json"></script>
    <script id="runtime-config" type="application/json"></script>
    <!-- Data Commons web components (used by ChartTile to render charts). -->
    <script src="https://datacommons.org/datacommons.js" defer></script>
    <!-- Cross-document view transition (browser cross-fade), only for
         navigations to/from same-origin Data Commons pages outside this app's
         base path. Must be inline and parser-blocking so `pagereveal` is
         registered before first render. DC's base.html has the mirror opt-in. -->
    <style>
      @media (prefers-reduced-motion: no-preference) {
        @view-transition { navigation: auto; }
      }
      /* The destination page's CSS sets the duration; keep in sync with DC base.html. */
      ::view-transition-old(root),
      ::view-transition-new(root) { animation-duration: 1s; }
    </style>
    <script>
      (function () {
        var base = '%BASE_URL%'.replace(/\/+$/, '');
        function isDataCommons(entry) {
          if (!base || !entry || !entry.url) return false;
          var path = new URL(entry.url).pathname;
          return path !== base && path.indexOf(base + '/') !== 0;
        }
        // Leaving: only animate when heading to a DC page.
        addEventListener('pageswap', function (e) {
          if (e.viewTransition && !isDataCommons(e.activation && e.activation.entry)) {
            e.viewTransition.skipTransition();
          }
        });
        // Arriving: only animate when coming from a DC page.
        addEventListener('pagereveal', function (e) {
          var activation = window.navigation && navigation.activation;
          if (e.viewTransition && !isDataCommons(activation && activation.from)) {
            e.viewTransition.skipTransition();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
