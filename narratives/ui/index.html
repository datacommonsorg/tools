<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- `#theme-tokens` holds optional `--theme-*` CSS custom property overrides,
         and `#instance-config` holds optional theme JSON read by `getInstanceConfig()`.
         `#runtime-config` holds the chat availability JSON that the server
         stamps when it serves this file, read by `getRuntimeConfig()`. -->
    <title id="theme-title">Data Commons</title>
    <link id="theme-favicon" rel="icon" type="image/svg+xml" href="/dc-logo.svg" />
    <style id="theme-tokens"></style>
    <script id="instance-config" type="application/json"></script>
    <script id="runtime-config" type="application/json"></script>
    <!-- Data Commons web components (used by ChartTile to render charts). -->
    <script src="https://datacommons.org/datacommons.js" defer></script>
    <!-- Cross-document view transition (browser cross-fade), only for
         navigations to/from same-origin Data Commons pages outside this app's
         base path. This app filters its outgoing navigations in
         `src/config/view_transition.ts`; DC's base.html has the mirror opt-in
         and filters its own. -->
    <style>
      @media (prefers-reduced-motion: no-preference) {
        @view-transition { navigation: auto; }
      }
      /* The destination page's CSS sets the duration; keep in sync with DC base.html. */
      ::view-transition-old(root),
      ::view-transition-new(root) { animation-duration: 1s; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
