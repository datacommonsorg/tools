# Project manifest for the Narratives app-plane agent.
#
# Direct dependencies are declared here; resolved transitive versions live in
# uv.lock, which is generated by `uv lock` and should not be edited by hand.

[project]
name = "narratives-agent"
version = "0.1.0"
description = "App-plane agent for Data Commons Narratives."
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "anyio>=4.15",
    "fastapi>=0.141",
    "google-cloud-secret-manager>=2.20",
    "google-genai>=1.0",
    "httpx>=0.28",
    "httpx2>=2.13",
    "mcp>=2.2",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-google-genai>=1.2b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-util-genai>=1.2b0",
    "pydantic-settings>=2.15",
    "python-dotenv>=1.2",
    "requests>=2.32",
    "sse-starlette>=3.5",
    "uvicorn[standard]>=0.53",
]

[project.scripts]
narratives-agent-dev = "narratives_agent.dev:main"

[dependency-groups]
dev = [
    "hadolint-py>=2.14",
    "mypy>=2.3",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.14",
    "shellcheck-py>=0.11",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/narratives_agent"]

[tool.uv]
required-version = ">=0.10.2"

# Override any system-wide corporate mirror (e.g. /etc/uv/uv.toml) so that
# `uv lock` always records public PyPI URLs in uv.lock.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

# ── Lint and format ──────────────────────────────────────────────────────────

[tool.ruff]
line-length = 80
target-version = "py314"
# Existing deploy scripts pending lint cleanup; remove entries as refactored.
extend-exclude = [
    "../deploy/check-state-owner.py",
    "../deploy/validate-branding.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["narratives_agent"]

[tool.ruff.format]
docstring-code-format = true

# ── Type checking ────────────────────────────────────────────────────────────
# Strict mode applies to every module, tests included, with no exemptions.
# Do not add `[[tool.mypy.overrides]]` blocks that ignore errors.

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
mypy_path = "src"
explicit_package_bases = true

# ── Tests ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*_test.py"]
filterwarnings = [
    # google-genai 2.25.0 references typing._UnionGenericAlias, deprecated
    # in Python 3.14. Remove when the SDK stops using it.
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google.genai.types",
]
