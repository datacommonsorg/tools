# Project manifest for the Narratives app-plane agent.
#
# Direct dependencies are declared here; resolved transitive versions live in
# uv.lock, which is generated by `uv lock` and should not be edited by hand.

[project]
name = "narratives-agent"
version = "0.1.0"
description = "App-plane agent for Data Commons Narratives."
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "flask>=3.1",
    "flask-cors>=6.0",
    "google-cloud-secret-manager>=2.20",
    "gunicorn>=23.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pytest>=8.0",
    "ruff>=0.14",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/narratives_agent"]

# Override any system-wide corporate mirror (e.g. /etc/uv/uv.toml) so that
# `uv lock` always records public PyPI URLs in uv.lock.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

# ── Lint and format ──────────────────────────────────────────────────────────

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["narratives_agent"]

[tool.ruff.format]
docstring-code-format = true

# ── Type checking ────────────────────────────────────────────────────────────
# Strict mode is enabled globally so that all new and rewritten modules are
# fully type-checked. Legacy modules scheduled for deletion or rewrite in
# subsequent migration stages are temporarily exempted below under
# [[tool.mypy.overrides]]. Do not add new modules to these override blocks;
# remove each entry as the corresponding module is deleted or rewritten.

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "main.py"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
# Branch 4 rewrites the web layer and decomposes config.py.
module = [
    "main",
    "narratives_agent.config",
    "narratives_agent.gcp_auth",
    "narratives_agent.server.app",
    "narratives_agent.server.routes",
    "narratives_agent.server.routes.brand",
    "narratives_agent.server.routes.chat",
    "narratives_agent.server.routes.dcproxy",
    "narratives_agent.server.routes.spa",
    "narratives_agent.server.routes.system",
]
ignore_errors = true

[[tool.mypy.overrides]]
# Branch 5 rewrites the pipeline and replaces SessionLogger with telemetry.
module = [
    "narratives_agent.session_logger",
    "narratives_agent.workflows.chart_config",
    "narratives_agent.workflows.chat_pipeline",
    "narratives_agent.workflows.follow_up",
    "narratives_agent.workflows.mcp_loop",
]
ignore_errors = true

[[tool.mypy.overrides]]
# Branch 6 replaces the hand-rolled Gemini REST client with google-genai.
module = [
    "narratives_agent.gemini.client",
    "narratives_agent.gemini.schemas",
]
ignore_errors = true

[[tool.mypy.overrides]]
# Branch 7 replaces the hand-rolled JSON-RPC client with the official MCP SDK.
module = [
    "narratives_agent.mcp.capabilities",
    "narratives_agent.mcp.client",
    "narratives_agent.mcp.data_utils",
    "narratives_agent.mcp.schema",
]
ignore_errors = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = ["flask_cors.*"]
ignore_missing_imports = true

# ── Tests ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*_test.py"]
