events {}

# Data-plane router.
#
# This container no longer serves the React UI and no longer proxies /agent/.
# Both moved to the app-plane service, which is now the only public front door
# and reverse-proxies the routes below to this service. See DECOUPLING-PLAN.md.
#
# What is left is purely internal routing between the servers that share this
# container: Mixer, the MCP server and the upstream Flask website.
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server {
    listen 8080;

    # ─── 1. Mixer API (upstream, served at /core/api/) ───────────────────
    location /core/api/ {
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,X-Requested-With' always;
            add_header 'Access-Control-Max-Age' 3600;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }
        rewrite /core/api/(.*) /$1 break;
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,X-Requested-With' always;
    }

    # ─── 2. MCP server (upstream) ────────────────────────────────────────
    # Called by the app-plane agent over HTTPS now, not by a sidecar over
    # localhost. Reaching it still requires getting past this service's
    # ingress, which is why the data plane is ingress=internal.
    location /mcp {
        proxy_pass http://localhost:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600;
        proxy_buffering off;
        proxy_cache off;
    }

    # ─── 3. Everything else → upstream Flask website ─────────────────────
    # Covers /api/observations/*, /api/place/*, /place/*, /browser/*,
    # /explore/*, /eval/*, /healthz, and any other upstream-managed paths.
    # With the SPA gone this is a true catch-all: there is no longer an
    # index.html here to serve, so an unknown path is the upstream's 404.
    location / {
        proxy_pass http://0.0.0.0:7070;
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600;
    }

    error_log /dev/stderr;
  }
}
